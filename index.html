<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Cumpleaños Damián</title>
    <style>
        /* Fondo ambientado */
        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle, #4a7c36 0%, #1e3b14 100%);
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            font-family: sans-serif;
            overflow-x: hidden; 
        }

        .invitacion-container {
            position: relative;
            display: inline-block;
            max-width: 500px; 
            width: 100%;
            z-index: 1; 
            margin-bottom: 80px; 
        }

        .invitacion-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 15px; 
            box-shadow: 0 15px 25px rgba(0,0,0,0.5); 
        }

        /* Botón transparente de Google Maps */
        .boton-ubicacion {
            position: absolute;
            top: 86.5%;     
            left: 11%;      
            width: 15%;     
            height: 6%;     
            background-color: transparent; 
            cursor: pointer; 
            z-index: 10;
        }

        /* NUEVO: Botón transparente de WhatsApp */
        .boton-confirmar {
            position: absolute;
            /* Estos porcentajes los calculé aproximadamente para que caigan sobre el letrero. 
               Si necesitas moverlo, activa el borde azul borrando los /* de abajo */
            top: 20%;       
            left: 15%;      
            width: 70%;     
            height: 7%;     
            background-color: transparent; 
            cursor: pointer; 
            z-index: 10;
            
            /* border: 2px solid blue; background-color: rgba(0,0,255,0.4); */
        }

        /* Botón de música flotante circular */
        .btn-musica {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 2px solid #a3c971;
            color: #fff;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 24px;
            z-index: 100;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            padding: 0;
        }

        .btn-musica:hover {
            background-color: rgba(163, 201, 113, 0.8);
            transform: scale(1.1);
        }

        /* Contenedores de los stickers */
        .contenedor-sticker {
            position: fixed; 
            top: 0;
            left: 0;
            z-index: 50;
            pointer-events: none; 
            user-select: none;
        }

        .icono-sticker {
            font-size: 50px; 
            filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.4));
        }

        #icono-regalo { animation: tambalear 2s infinite ease-in-out; }
        #icono-sobre { animation: tambalear 2.5s infinite ease-in-out reverse; }

        @keyframes tambalear {
            0%, 100% { transform: rotate(-12deg); }
            50% { transform: rotate(12deg); }
        }
    </style>
</head>
<body>

    <!-- Audio -->
    <audio id="audioFondo" loop>
        <source src="sonido-dinosaurios.mp3" type="audio/mpeg">
    </audio>

    <!-- Botón circular para controlar el sonido -->
    <button class="btn-musica" id="btnAudio" onclick="toggleAudio()">
        🔇
    </button>

    <!-- Stickers flotantes -->
    <div id="contenedor-regalo" class="contenedor-sticker">
        <div id="icono-regalo" class="icono-sticker">🎁</div>
    </div>
    <div id="contenedor-sobre" class="contenedor-sticker">
        <div id="icono-sobre" class="icono-sticker">💌</div>
    </div>

    <!-- Contenedor principal de la invitación -->
    <div class="invitacion-container">
        <!-- Tu NUEVA imagen -->
        <img src="Gemini_Generated_Image_7h58s97h58s97h58.jpg" alt="Invitación Damián 2 Años">
        
        <!-- Enlace a Google Maps -->
        <a href="https://www.google.com/maps/place/Salon+SG/@25.5312487,-100.9378834,17z/data=!3m1!4b1!4m6!3m5!1s0x8688130065b20a79:0x3b0eb8757d6aa223!8m2!3d25.5312487!4d-100.9378834!16s%2Fg%2F11xt68fttb!18m1!1e1?entry=ttu&g_ep=EgoyMDI2MDkxNS4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="boton-ubicacion" title="Abrir ubicación en Google Maps"></a>

        <!-- NUEVO: Enlace a WhatsApp (RECUERDA CAMBIAR EL NÚMERO) -->
        <!-- Cambia NUMERO_AQUI por tu teléfono, por ejemplo: 521234567890 (código de país sin el + seguido de tu número) -->
        <a href="https://wa.me/528442958983?text=Hola,%20confirmo%20la%20asistencia%20a%20la%20fiesta%20de%20Dami%C3%A1n." target="_blank" class="boton-confirmar" title="Confirmar asistencia por WhatsApp"></a>
    </div>

    <script>
        // --- Lógica del sonido ---
        var audio = document.getElementById("audioFondo");
        var btn = document.getElementById("btnAudio");

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                btn.innerHTML = "🔊"; 
                btn.style.backgroundColor = "rgba(163, 201, 113, 0.8)";
            } else {
                audio.pause();
                btn.innerHTML = "🔇"; 
                btn.style.backgroundColor = "rgba(255, 255, 255, 0.2)";
            }
        }

        // --- Lógica de los stickers ---
        function iniciarSticker(idElemento) {
            const contenedor = document.getElementById(idElemento);
            const tamano = 60; 

            let posX = Math.random() * (window.innerWidth - tamano);
            let posY = Math.random() * (window.innerHeight - tamano);
            
            let velocidadX = (Math.random() * 1.5 + 0.8);
            let velocidadY = (Math.random() * 1.5 + 0.8);

            if (Math.random() > 0.5) velocidadX = -velocidadX;
            if (Math.random() > 0.5) velocidadY = -velocidadY;

            function animar() {
                posX += velocidadX;
                posY += velocidadY;

                if (posX + tamano >= window.innerWidth || posX <= 0) {
                    velocidadX = -velocidadX; 
                }
                if (posY + tamano >= window.innerHeight || posY <= 0) {
                    velocidadY = -velocidadY; 
                }

                contenedor.style.transform = `translate(${posX}px, ${posY}px)`;
                requestAnimationFrame(animar);
            }

            animar();
        }

        iniciarSticker('contenedor-regalo');
        iniciarSticker('contenedor-sobre');
    </script>
</body>
</html>
